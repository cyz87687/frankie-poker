name: Deploy site and app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The game itself, served under /app/ of this Pages site. The build is
      # always key-free: no OPENROUTER_API_KEY reaches the workflow, and
      # players bring their own key in Game settings -> AI connection.
      - name: Build the app
        run: |
          npm ci
          npm run build -- --base=/${{ github.event.repository.name }}/app/
      # The home page first: build-site.sh wipes _site/, then the app moves in.
      - name: Assemble the site
        run: |
          ./scripts/build-site.sh
          mkdir -p _site/app
          cp -r dist/* _site/app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
